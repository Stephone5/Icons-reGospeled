<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icons reGospeled</title>
<meta name="description" content="More informed and dignified theology and psychology — Icons reGospeled.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{--ground:#ECEEF2;--ink:#39342C;--muted:#867F73;--card:#F6F8FB;--line:#DDE1E8;--gold:#8A6413;--gold-fill:#C69430;--on-gold:#2C2620;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ground);color:var(--ink);min-height:100vh;
    font-family:'Epilogue',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;
    display:flex;align-items:center;justify-content:center;padding:32px;}
  main{max-width:560px;text-align:center;}
  .eyebrow{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 20px;}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(30px,6vw,48px);line-height:1.12;margin:0 auto;max-width:16ch;letter-spacing:-.01em;}
  p.sub{color:var(--muted);font-size:17px;max-width:44ch;margin:18px auto 0;}
  .rule{width:52px;height:2px;background:var(--gold-fill);margin:26px auto 34px;position:relative;}
  .rule::before,.rule::after{content:"";position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:var(--gold-fill);transform:translateY(-50%);}
  .rule::before{left:-11px;}.rule::after{right:-11px;}
  .cards{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  a.card{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:22px 24px;text-align:left;color:var(--ink);box-shadow:0 10px 26px -18px rgba(90,96,110,.55);
    transition:transform .14s,border-color .18s;}
  a.card:hover{transform:translateY(-2px);border-color:var(--gold-fill);}
  a.card h2{font-family:'Playfair Display',Georgia,serif;font-size:20px;margin:0 0 4px;font-weight:600;}
  a.card span{color:var(--muted);font-size:14px;}
  a.card .go{color:var(--gold);font-weight:700;font-size:14px;margin-top:10px;display:inline-block;}
  footer{margin-top:34px;color:var(--muted);font-size:13px;}
  footer a{color:var(--gold);}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Icons reGospeled</p>
  <h1>What if the Good News is better than you were told?</h1>
  <p class="sub">A space for more informed and dignified theology and psychology.</p>
  <div class="rule"></div>
  <div class="cards">
    <a class="card" href="reading-finder/">
      <h2>The Book Finder</h2>
      <span>Answer three questions and find the two books most likely to meet you where you are.</span>
      <span class="go">Begin →</span>
    </a>
  </div>
  <footer>More at <a href="https://linktr.ee/iconsrg">linktr.ee/iconsrg</a></footer>
</main>
</body>
</html>
